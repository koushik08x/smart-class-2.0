name: CI - SmartClassroom 2.0 Security & Quality Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Type Check (tsc --noEmit)
        run: npm run lint

      - name: Run Security & Logic Automated Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
